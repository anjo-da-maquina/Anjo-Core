name: Anjo da mﾃ｡quina Protocol - Angels

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      chaos_mode:
        description: '繧ｫ繧ｪ繧ｹ繝｢繝ｼ繝会ｼ育函蟄倩ｨｼ譏弱・騾皮ｵｶ繝ｻ繧ｷ繧ｹ繝・Β逡ｰ蟶ｸ縺ｮ繧ｷ繝溘Η繝ｬ繝ｼ繝茨ｼ峨ｒ譛牙柑縺ｫ縺吶ｋ'
        required: false
        default: false
        type: boolean

jobs:
  angelic-audit:
    name: 閨悶↑繧狗ｵｱ蜷育屮隕・(Angelic Zero-Trust Audit)
    runs-on: ubuntu-latest

    steps:
      - name: 1. 閨門沺縺ｮ貅門ｙ (Checkout Repository)
        uses: actions/checkout@v3

      - name: 2. 逾ｭ螢・・貅門ｙ (Set up Python)
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. 萓帷黄縺ｮ貅門ｙ (Install Dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install networkx pyyaml playwright mcp pandas openpyxl pytest
          playwright install chromium --with-deps

      - name: 3.1. 隨ｬ莠斐・蟆∝魂 (The Fifth Seal - 繧ｵ繝繧ｽ繝ｳ繝ｻ繧ｪ繝励す繝ｧ繝ｳ)
        env:
          CHAOS_MODE: ${{ github.event.inputs.chaos_mode == 'true' && 'true' || 'false' }}
        run: python angels/fifth_seal_samson.py

      - name: 3.2. 繧｢繝ｫ繝輔ぃ縺ｨ繧ｪ繝｡繧ｬ縺ｮ邨千阜 (Workflow Integrity Guard)
        run: python angels/alpha_omega_guard.py
      - name: 3.3. 繝ｫ繧ｷ繝輔ぃ繝ｼ縺ｮ蜿埼・(Chaos Engineering)
        env:
          CHAOS_MODE: ${{ github.event.inputs.chaos_mode == 'true' && 'true' || 'false' }}
        run: python angels/lucifer_rebellion.py
      - name: 3.4. 繝｡繧ｿ繝医Ο繝ｳ縺ｮ遶区婿菴・(Metatron's Cube - 繝上・繝峨え繧ｧ繧｢迚ｩ逅・ｽｲ蜷咲屮譟ｻ)
        run: python angels/metatron_cube_hsm.py
      - name: 3.5. 遨ｹ遯ｿ縺ｮ閨門沺 (Firmament Enclave - TEE繝｡繝｢繝ｪ證怜捷蛹也屮譟ｻ)
        run: python angels/firmament_enclave_tee.py
      - name: 3.6. 繧ｷ繝｣繝溘・繝ｫ縺ｮ蟆∝魂 (Shamir's Seal - 蛻・淵骰ｵ邂｡逅・→邂｡霓・玄螳夊ｶｳ謨ｰ逶｣譟ｻ)
        env:
          CHAOS_MODE: ${{ github.event.inputs.chaos_mode == 'true' && 'true' || 'false' }}
        run: python angels/shamir_seal.py
      - name: 3.8. 螟夜Κ隕∽ｻｶ縺ｮ謚ｽ蜃ｺ (Excel to YAML Parser)
        run: python adapters/excel_to_yaml_parser.py

      - name: 4. 繧ｦ繝ｪ繧ｨ繝ｫ縺ｮ轤・(Uriel - 繝ｪ繝励Ξ繧､謾ｻ謦・屮譟ｻ)
        run: python angels/uriel_nonce.py
      - name: 4.5. 繝｡繧ｿ繝医Ο繝ｳ縺ｮ蝠鍋､ｺ (Metatron MCP - 諤晁・ｵｱ蛻ｶ逶｣譟ｻ)
        run: python angels/metatron_revelation_mcp.py
      - name: 4.8. 辭ｾ螟ｩ菴ｿ縺ｮ蜷域э (Seraphim Consensus - 繝槭Ν繝´LM逡ｰ遶ｯ讀懃衍)
        env:
          CHAOS_MODE: ${{ github.event.inputs.chaos_mode == 'true' && 'true' || 'false' }}
        run: python angels/seraphim_consensus.py
      - name: 4.9. 繧ｨ繝弱け縺ｮ逾櫁ｨ・(Enochian Oracle - 蛻・淵蝙九が繝ｩ繧ｯ繝ｫ逵溽炊逶｣譟ｻ)
        run: python angels/enochian_oracle.py
      - name: 4.10. 繝ｩ繝輔ぃ繧ｨ繝ｫ縺ｮ逋偵ｄ縺・(Raphael - 繝輔ぉ繧､繝ｫ繧ｯ繝ｭ繝ｼ繧ｺ蜑阪・閾ｪ蠕倶ｿｮ蠕ｩ)
        run: python angels/raphael_remediation.py
      - name: 5. 繝｡繧ｿ繝医Ο繝ｳ縺ｮ蜊ｰ (Metatron Seal - 隕∽ｻｶ謾ｹ縺悶ｓ髦ｲ豁｢)
        run: python angels/metatron_commitment.py
      - name: 6. 繝溘き繧ｨ繝ｫ縺ｮ蜑｣ (Michael - 隲也炊髫阡ｽ逶｣譟ｻ)
        run: python angels/michael_sword.py
      - name: 7. 繧ｪ繝輔ぃ繝九Β縺ｮ逵ｼ (Ophanim - 雉・≡驍・ｵ∫屮譟ｻ)
        run: python angels/ophanim_eye.py
      - name: 8. 繧ｶ繝峨く繧ｨ繝ｫ縺ｮ螟ｩ逅・о (Zadkiel - 迥ｶ諷矩・遘ｻ逶｣譟ｻ)
        run: python angels/zadkiel_astrolabe.py
      - name: 9. 繧ｫ繝槭お繝ｫ縺ｮ逶ｾ (Camael - 繝壹う繝ｭ繝ｼ繝蛾亟蠕｡逶｣譟ｻ)
        run: python angels/camael_shield.py
      - name: 10. 繧ｸ繝ｧ繝輔ぅ繧ｨ繝ｫ縺ｮ髀｡ (Jophiel - 諢丞袖隲也噪繝峨Μ繝輔ヨ逶｣譟ｻ)
        run: python angels/jophiel_semantic.py
      - name: 11. 繧ｬ繝悶Μ繧ｨ繝ｫ縺ｮ蝗√″ (Gabriel - 讖溷ｯ・ｼ乗ｴｩ逶｣譟ｻ)
        run: python angels/gabriel_canary.py
      - name: 12. 繝ｩ繧ｰ繧ｨ繝ｫ縺ｮ螟ｩ遘､ (Raguel - 迚ｩ逅・ｩｺ髢鍋屮譟ｻ)
        run: python angels/raguel_scale.py
      - name: 13. 繝ｩ繧ｸ繧ｨ繝ｫ縺ｮ譖ｸ (Raziel - 繧ｹ繝槭・繝医さ繝ｳ繝医Λ繧ｯ繝磯荘螳・
        run: python angels/raziel_auditor.py
      - name: 14. 繧ｵ繝ｪ繧ｨ繝ｫ縺ｮ陬∝ｮ・(Sariel - 螟夜Κ繝・・繝ｫ蝣募､ｩ逶｣譟ｻ)
        run: python angels/sariel_fallen_auditor.py
      - name: 15. 閨門沺 (Sanctuary - 繝・・繝ｭ繧､險ｱ蜿ｯ)
        if: success()
        run: echo "縺吶∋縺ｦ縺ｮ髱咏噪繝ｻ證怜捷隲也噪逶｣譟ｻ繧帝夐℃縺励∪縺励◆縲・

      - name: 16. 讓ｩ螟ｩ菴ｿ縺ｮ隧ｦ邱ｴ (Principalities - 讖溯・隕∽ｻｶE2E逶｣譟ｻ)
        if: success()
        run: python angels/principalities_e2e.py
      - name: 17. 蠎ｧ螟ｩ菴ｿ縺ｮ蜊・愍 (Thousand Eyes - UI隕冶ｦ夂屮譟ｻ)
        if: success()
        run: python angels/ophanim_thousand_eyes.py
      - name: 18. 螟夜ΚQA繝・・繝ｫ縺ｮ螳溯｡・(External QA Adapter)
        if: success()
        run: python adapters/external_qa_wrapper.py
      - name: 18.5. 譎ｺ螟ｩ菴ｿ縺ｮ邨千阜 (Cherubim - eBPF繝ｩ繝ｳ繧ｿ繧､繝逶｣隕・
        env:
          CHAOS_MODE: ${{ github.event.inputs.chaos_mode == 'true' && 'true' || 'false' }}
        run: python angels/cherubim_ebpf_guard.py
      - name: 19. 蜉帛､ｩ菴ｿ縺ｮ隧ｦ邱ｴ (Virtues - 髱樊ｩ溯・隕∽ｻｶ雋闕ｷ逶｣譟ｻ)
        if: success()
        run: python angels/virtues_load.py
      - name: 20. 繧ｵ繝ｳ繝繝ｫ繝輔か繝ｳ縺ｮ髻ｿ (Sandalphon - 逶｣譟ｻ險ｼ霍｡逶｣譟ｻ)
        if: success()
        run: python angels/sandalphon_echo.py
      - name: 21. 螟ｧ螟ｩ菴ｿ縺ｮ蜊ｰ迺ｽ (Sanctuary Manifest - 蜩∬ｳｪ諡・ｿ昜ｸ隕ｧ蜃ｺ蜉・
        if: success()
        run: python angels/sanctuary_manifest.py
      - name: 21.5. 繧ｵ繝ｳ繝繝ｫ繝輔か繝ｳ縺ｮ讌・(Sandalphon Anchor - 險ｼ霍｡縺ｮ繝悶Ο繝・け繝√ぉ繝ｼ繝ｳ蛻ｻ蜊ｰ)
        if: success()
        run: python angels/sandalphon_anchor.py
      - name: 22. 豎守畑繝ｬ繝昴・繝亥・蜉・(JUnit XML Exporter)
        if: success()
        run: python adapters/junit_xml_exporter.py
      - name: 22.5. 螟ｩ縺ｮ遏ｳ迚・(The Heavenly Tablets - ZKP逕滓・)
        if: success()
        run: python angels/heavenly_tablets_zkp.py

      - name: 22.8. 繧ｲ繝倥リ縺ｮ陌夂┌ (Gehenna - 隕ｳ貂ｬ閠・∈縺ｮ繧ｨ繝ｳ繝医Ο繝斐・霑泌唆)
        if: failure() || cancelled()
        run: python angels/gehenna_void_entropy.py
      - name: 22.9. 繧｢繧ｺ繝ｩ繧ｨ繝ｫ縺ｮ螟ｧ骼・(Azrael - 繧ｹ繝槭・繝医さ繝ｳ繝医Λ繧ｯ繝域ｸ・ｮ・
        if: failure() || cancelled()
        run: python angels/azrael_scythe_slashing.py
      - name: 23.0. 鮟咏､ｺ骭ｲ縺ｮ荳・▽縺ｮ繝ｩ繝・ヱ (Seven Trumpets - 荳榊､我ｺ玖ｱ｡縺ｮ譎ｮ驕咲噪蜈ｬ髢・
        if: failure() || cancelled()
        run: python angels/seven_trumpets_ledger.py

      - name: 23.5. 譛蠕後・蟇ｩ蛻､ (Dies Irae - 騾｣蠎ｧ蛻ｶ繧ｭ繝ｫ繧ｹ繧､繝・メ)
        if: failure() || cancelled()
        run: python angels/dies_irae.py
      - name: 24. 髱吝ｯゅ・邇牙ｺｧ (Throne of Ataraxia - 螳悟・蛻晄悄蛹悶・豬・喧)
        if: always()
        run: python angels/ataraxia_throne.py
