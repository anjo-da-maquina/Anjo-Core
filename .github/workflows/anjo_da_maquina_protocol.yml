name: Anjo da máquina Zero-Trust Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  zero-trust-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies (Awaken the neural network)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Stage 1 - External Requirements Extraction
        run: python adapters/excel_to_yaml_parser.py

      - name: Stage 2 - Angelic Security Audits
        run: |
          python angels/alpha_omega_guard.py
          python angels/lucifer_rebellion.py
          python angels/metatron_cube_hsm.py
          python angels/firmament_enclave_tee.py
          python angels/shamir_seal.py
          python angels/uriel_nonce.py
          python angels/gehenna_purge.py
          python angels/azrael_termination.py
          python angels/michael_aegis.py
          python angels/gabriel_trumpet.py
          python angels/raphael_remedy.py
          
      - name: Stage 3 - Consensus and Final Lock (Ataraxia)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python agent/consensus_agent.py
          python angels/throne_of_ataraxia.py

      - name: Stage 4 - Export the Seal of Sanity (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Ataraxia-Certificate
          path: ataraxia_certificate.json
