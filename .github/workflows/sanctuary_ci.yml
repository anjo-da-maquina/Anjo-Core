name: Sanctuary CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify_ataraxia:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest rsa

    - name: Execute Sanctuary Verification
      run: |
        # クラウド上(未承認環境)で防壁が正しく発動し、遮断されるかを検証
        pytest tests/ -v -s
