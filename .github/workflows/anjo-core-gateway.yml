name: Anjo-Core Zero-Trust Gateway

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  anjo-core-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Initialize Anjo-Core Agentic Swarm
        run: echo "Initializing 37 validation agents in simulated TEE..."

      - name: Phase 1 - MCP Requirements Parsing
        env:
          SPEC_FILE_PATH: "docs/system_requirements.yaml"
        run: python agents/mcp_parser.py

      - name: Phase 2 - Consensus Agent Verification
        run: python agents/consensus_agent.py

      - name: Phase 3 - Execute Validation / Samson Option
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DUMMY_SECRET_KEY: "super_secret_value_that_should_not_leak"
          SIMULATE_ANOMALY: "false" 
        run: python agents/samson_option.py

      - name: Merge to Main
        run: echo "Validation successful. Structural sovereignty maintained."
